@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap');
/* ============================================================
   MILLRACE HOME PAGE — the only custom CSS for this page.
   Everything structural (column widths, gaps, spacing, the hero
   gradient) is set natively in the Elementor editor. What remains
   here is small styling for repeated pieces (cards, chips, the
   quote tool, the mobile bar) plus a few things the free editor
   has no control for — each block says what it does and why.
   ============================================================ */
body{font-family:'Manrope',ui-sans-serif,system-ui,sans-serif;background:#f7f6f1;color:#152a28}
h1,h2,h3,h4,h5{font-family:'Archivo',sans-serif}
.mr-nav{display:flex;justify-content:flex-end;gap:32px;padding-top:13px;white-space:nowrap}
.mr-nav a{font-family:'Manrope';font-weight:600;font-size:15px;color:#152a28;text-decoration:none}
.mr-nav a:hover{color:#0f3b3a}
.mr-nav a.mr-active{font-weight:700;border-bottom:2px solid #ff8a33;padding-bottom:7px}
.mr-call small{display:block;letter-spacing:1.9px;font-size:10.5px;font-weight:700;color:#66766f;white-space:nowrap}
.mr-call strong{display:block;font-size:16.5px;color:#152a28;font-weight:800;margin-top:1px;white-space:nowrap}
.mr-badge{display:inline-block;border:1px solid rgba(247,246,241,.5);border-radius:999px;padding:9px 18px;letter-spacing:2.6px;font-size:11px;font-weight:700;color:#f7f6f1;font-family:'Manrope'}
.mr-stars{color:#ff8a33;letter-spacing:2.5px;font-size:15px}
/* header column widths are set natively on the columns themselves (Column Width %) — no CSS needed */
/* hero: the dark gradient over the photo is a normal background-overlay IMAGE set in the editor (media library: "Hero gradient overlay") — no CSS needed. Only the copy column width is pinned here. */
/* mobile header hidden except on phones; desktop header hidden on phones */
.mr-mhead-sec{display:none}
@media (max-width: 767px){
  .mr-mhead-sec{display:block}
  .mr-header-sec{display:none}
  .mr-badge{font-size:9.5px;letter-spacing:1.7px;padding:8px 12px}
}
/* M1 fixes round 2 */
.mr-strip-sec > .elementor-container > .elementor-column:nth-child(2),
.mr-strip-sec > .elementor-container > .elementor-column:nth-child(3){border-left:1px solid rgba(247,246,241,0.16)}
@media (max-width: 767px){
  .mr-mhead-sec > .elementor-container{display:flex;flex-wrap:nowrap;align-items:center}
  .mr-hero-sec .elementor-inner-section > .elementor-container{flex-direction:column}
  .mr-hero-sec .elementor-inner-section > .elementor-container > .elementor-column{flex:1 1 100%;width:100%}
  .mr-hero-sec .elementor-inner-section .elementor-button{width:100%}
}

/* M1 fixes round 3 */
@media (max-width: 767px){ .mr-strip-sec{margin-top:0 !important} }

/* M1 fixes round 4 */
@media (max-width: 767px){ .mr-hero-sec{background-position:72% center !important} }

/* ================= M2 (full home page) ================= */
h1,h2,h3,h4,h5{letter-spacing:-0.02em}
/* kill Elementor default widget spacing on this page; all rhythm is explicit margins */
.elementor-33 .elementor-widget:not(:last-child){margin-block-end:0}
/* content inset: original container = 1152 box + 24px (16px phone) inner padding */
@media (min-width:768px){
  .mr-inset > .elementor-container > .elementor-column:first-of-type > .elementor-widget-wrap{padding-left:24px}
  .mr-inset > .elementor-container > .elementor-column:last-of-type > .elementor-widget-wrap{padding-right:24px}
}
@media (max-width:767px){
  .mr-inset > .elementor-container > .elementor-column:first-of-type > .elementor-widget-wrap{padding-left:16px}
  .mr-inset > .elementor-container > .elementor-column:last-of-type > .elementor-widget-wrap{padding-right:16px}
}
/* header: border + sticky like the original; phone stack vertically centred */
.mr-header-sec{border-bottom:1px solid #e1ded4;position:sticky;top:0;z-index:99}
.mr-mhead-sec{border-bottom:1px solid #e1ded4;position:sticky;top:0;z-index:99}
/* Mobile drop-down menu: the section is hidden until the burger button's
   link makes it the page target. This CSS-only toggle needs no JavaScript,
   never appears on desktop, and drops the five normal page links below the
   sticky phone header in the site's cream / teal / orange language. */
.mr-mmenu-sec{display:none !important}
@media (max-width:767px){
  .mr-mmenu-sec:target{display:flex !important;position:fixed;top:65px;left:0;right:0;z-index:98;max-height:calc(100svh - 65px);overflow:auto;background:#f7f6f1;border-bottom:1px solid #e1ded4;box-shadow:0 22px 28px -24px rgba(21,42,40,0.5)}
  .mr-mnav{display:flex;flex-direction:column;padding:6px 0 10px}
  .mr-mnav a{display:flex;align-items:center;min-height:52px;padding:13px 20px;border-top:1px solid #e9e6dc;color:#152a28;font-family:'Manrope';font-size:16px;font-weight:700;line-height:1.25;text-decoration:none}
  .mr-mnav a:first-child{border-top:0}
  .mr-mnav a:hover,.mr-mnav a:focus{background:#f2f1eb;color:#0f3b3a}
  .mr-mnav a.mr-mnav-active{color:#0f3b3a;box-shadow:inset 4px 0 0 #ff8a33}
  .mr-mnav a.mr-mnav-close{min-height:44px;justify-content:center;color:#0f3b3a;font-size:13px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}
}
.mr-header-sec .elementor-inner-section > .elementor-container{align-items:center}
.mr-header-sec .elementor-inner-section .elementor-column > .elementor-widget-wrap{padding-top:0;padding-bottom:0}
.mr-call{line-height:1.18}
/* hero: full first screen, content centred in the zone above the facts strip */
.mr-hero-sec{display:flex;align-items:center;min-height:calc(100svh - 65px);padding-bottom:0}
.mr-hero-sec > .elementor-container{width:100%}
@media (min-width:640px){
  /* hero fills the first screen under the header; the bottom 71px is where the facts strip overlaps,
     so the copy is centred in the space above the strip: nudge it up by half the strip height (36px) */
  .mr-hero-sec{min-height:calc(100svh - 81px);padding-bottom:71px}
  .mr-hero-sec > .elementor-container{transform:translateY(-36px)}
}
@media (min-width:640px) and (max-width:767px){ .mr-hero-sec{min-height:calc(100svh - 65px)} }
