@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap');
/* ============================================================
   MILLRACE HOME PAGE — the only custom CSS for this page.
   Everything structural (column widths, gaps, spacing, the hero
   gradient) is set natively in the Elementor editor. What remains
   here is small styling for repeated pieces (cards, chips, the
   quote tool, the mobile bar) plus a few things the free editor
   has no control for — each block says what it does and why.
   ============================================================ */
body{font-family:'Manrope',ui-sans-serif,system-ui,sans-serif;background:#f7f6f1;color:#152a28}
h1,h2,h3,h4,h5{font-family:'Archivo',sans-serif}
.mr-nav{display:flex;justify-content:flex-end;gap:2px;white-space:nowrap}
.mr-nav a{font-family:'Manrope';font-weight:600;font-size:14px;line-height:1.43;color:rgba(21,42,40,0.7);text-decoration:none;padding:8px 10px;border-radius:10px}
.mr-nav a:hover{color:rgba(21,42,40,0.9)}
.mr-nav a.mr-active{color:#152a28;position:relative}
.mr-nav a.mr-active::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:#ff8a33;border-radius:2px}
.mr-vdiv{display:block;width:1px;height:32px;background:#e1ded4;margin:0 auto}
.mr-call{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;text-decoration:none}
.mr-call:hover{background:rgba(237,234,225,0.55)}
.mr-call-disc{flex:0 0 36px;width:36px;height:36px;border-radius:50%;background:#0f3b3a;color:#f7f6f1;display:inline-flex;align-items:center;justify-content:center}
.mr-call-disc svg{width:13px;height:13px}
.mr-call-stack{line-height:1}
.mr-call small{display:block;text-transform:uppercase;letter-spacing:1.4848px;font-size:9.28px;font-weight:700;color:#5d6a66;white-space:nowrap}
.mr-call strong{display:block;font-family:'Archivo';font-size:16.8px;line-height:21px;color:#152a28;font-weight:700;margin-top:2px;white-space:nowrap}
.mr-badge{display:inline-block;background:rgba(15,59,58,0.3);border:1px solid rgba(247,246,241,0.2);border-radius:999px;padding:6px 12px;letter-spacing:1.792px;font-size:11.2px;font-weight:700;color:#f7f6f1;font-family:'Manrope'}
.mr-stars{color:#ff8a33;letter-spacing:2.5px;font-size:15px}
/* header column widths are set natively on the columns themselves (Column Width %) — no CSS needed */
/* hero: the dark gradient over the photo is a normal background-overlay IMAGE set in the editor (media library: "Hero gradient overlay") — no CSS needed. Only the copy column width is pinned here. */
/* small header hidden on desktop; desktop header hidden below desktop —
   the original keeps its small header all the way up to 1024 (M6) */
.mr-mhead-sec{display:none}
@media (max-width: 1023px){
  .mr-mhead-sec{display:block}
  .mr-header-sec{display:none}
}
/* facts strip dividers + column padding are native per-column settings (M5) */
.mr-strip-sec > .e-con-inner > .e-con:nth-child(2),
.mr-strip-sec > .e-con-inner > .e-con:nth-child(3){border-left:0}
@media (max-width: 767px){
  .mr-mhead-sec > .elementor-container{display:flex;flex-wrap:nowrap;align-items:center}
  .mr-hero-sec .elementor-inner-section > .elementor-container{flex-direction:column}
  .mr-hero-sec .elementor-inner-section > .elementor-container > .elementor-column{flex:1 1 100%;width:100%}
  .mr-hero-sec .elementor-inner-section .elementor-button{width:100%}
}

/* M1 fixes round 3 */
@media (max-width: 767px){ .mr-strip-sec{margin-top:0 !important} }

/* M1 fixes round 4 */
.mr-hero-sec{background-position:68% center !important;position:relative}
.mr-hero-sec::before{content:"";position:absolute;inset:0;background:linear-gradient(to right, rgba(15,59,58,0.95) 0%, rgba(15,59,58,0.78) 50%, rgba(15,59,58,0.1) 100%);pointer-events:none}
.mr-hero-sec > .e-con-inner{position:relative;z-index:1}

/* ================= M2 (full home page) ================= */
h1,h2,h3,h4,h5{letter-spacing:-0.02em}
/* kill Elementor default widget spacing on this page; all rhythm is explicit margins */
.elementor-33 .elementor-widget:not(:last-child){margin-block-end:0}
/* content inset: original container = 1152 box + 24px (16px phone) inner padding */
@media (min-width:768px){
  .mr-inset > .elementor-container > .elementor-column:first-of-type > .elementor-widget-wrap{padding-left:24px}
  .mr-inset > .elementor-container > .elementor-column:last-of-type > .elementor-widget-wrap{padding-right:24px}
}
@media (max-width:767px){
  .mr-inset > .elementor-container > .elementor-column:first-of-type > .elementor-widget-wrap{padding-left:16px}
  .mr-inset > .elementor-container > .elementor-column:last-of-type > .elementor-widget-wrap{padding-right:16px}
}
/* header: border + sticky like the original; phone stack vertically centred */
.mr-header-sec{border-bottom:1px solid #e1ded4;position:sticky;top:0;z-index:99}
.mr-mhead-sec{border-bottom:1px solid #e1ded4;position:sticky;top:0;z-index:99}
.mr-mbtn{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;margin-left:auto}
.mr-mbtn svg{width:20px;height:20px}
.mr-mbtn-tel{background:#ff8a33;color:#231a12}
.mr-mbtn-menu{background:#fff;border:1px solid #d8d4c9;color:#152a28}
@media (max-width:767px){
  .mr-hero-sec > .e-con-inner{height:100%;align-items:center;justify-content:center !important}
  .mr-hero-sec > .e-con-inner > .e-con{justify-content:center;align-self:center}

/* ================= M6 (responsive parity with the original) =================
   The original steps its layout at 640 / 768 / 1024 px, but Elementor's own
   device steps sit at 767 / 1024 — so the bands between the two systems are
   set here. Everything else responsive is native element settings. */

/* ---- 640–767: the original's first step up from phones ---- */
@media (min-width:640px) and (max-width:767px){
  /* hero copy at the original's fixed measure (576, plus its 16 phone inset) */
  .mr-hero-sec > .e-con-inner > .e-con:first-child{width:592px !important;max-width:592px;flex:none !important;align-self:flex-start !important}
  .mr-hero-sec h1.elementor-heading-title{font-size:48px !important;letter-spacing:-1.44px !important}

  .mr-hero-btns{flex-direction:row !important;flex-wrap:nowrap !important}

  .mr-hero-btns > .e-con:last-child{flex:0 0 37.5% !important;width:37.5% !important}

  .mr-promises-sec > .e-con-inner, .mr-services-sec > .e-con-inner{flex-direction:row !important;flex-wrap:wrap !important}
  .mr-promises-sec > .e-con-inner > .e-con{flex:0 0 calc((100% - 24px) / 2) !important;width:calc((100% - 24px) / 2) !important}
  .mr-services-sec > .e-con-inner > .e-con{flex:0 0 calc((100% - 20px) / 2) !important;width:calc((100% - 20px) / 2) !important}
  /* call band type at this size */
  .mr-cta-h2{font-size:30px !important;line-height:36px !important;letter-spacing:-0.75px !important}
  .mr-cta-btns .b1{font-size:20px !important;line-height:28px !important}
}

/* ---- the small header below desktop: one flex row, logo takes the slack ---- */
@media (max-width:1023px){

/* ---- 768–1023: the original's middle step (small tablets) ---- */
@media (min-width:768px) and (max-width:1023px){

  .mr-hero-sec > .e-con-inner > .e-con:first-child{flex:0 0 600px !important;width:600px !important}

/* ---- 1024 and up: the original's desktop step starts here, not at 1025 ---- */
@media (min-width:1024px){

  .mr-hero-sec h1.elementor-heading-title{font-size:clamp(40px, 3.5vw, 60px) !important;letter-spacing:-0.03em !important}
  .mr-hero-sec > .e-con-inner > .e-con:first-child{flex:0 0 calc(clamp(576px, 36.6vw, 628.6px) + 24px) !important;width:calc(clamp(576px, 36.6vw, 628.6px) + 24px) !important}

  .mr-services-sec > .e-con-inner{flex-wrap:nowrap !important}
